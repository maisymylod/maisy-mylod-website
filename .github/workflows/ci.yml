name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: HTML validity + internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the validator
        run: pip install html5validator==0.4.2

      - name: HTML is valid
        # HTML only. The bundled CSS checker is years out of date and reports
        # backdrop-filter, inset, and modern rgb() syntax as errors.
        run: html5validator --root .

      - name: Internal links, assets, and anchors resolve
        run: python scripts/check_links.py
